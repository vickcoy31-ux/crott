name: Analisis kernel 5.10 (dari ZIP Google Drive)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu binutils llvm file unzip curl

      - name: Download ZIP dari Google Drive (ikutin konfirmasi)
        run: |
          FILE_ID="1of-GgKWXdA0aiqF2fznk9q2Up5teDFgC"
          URL="https://drive.google.com/uc?export=download&id=${FILE_ID}"
          # langkah 1: ambil halaman (bisa jadi halaman konfirmasi)
          curl -sc /tmp/gcookies "$URL" -o /tmp/page.html
          if grep -q "confirm=" /tmp/page.html; then
            echo "Drive minta konfirmasi — ambil token..."
            CONFIRM=$(grep -o 'name="confirm" value="[^"]*"' /tmp/page.html | sed 's/.*value="//;s/"//' | head -1)
            curl -sb /tmp/gcookies -L "https://drive.google.com/uc?export=download&confirm=${CONFIRM}&id=${FILE_ID}" -o paket.zip
          else
            cp /tmp/page.html paket.zip
          fi
          ls -la paket.zip
          file paket.zip
          # validasi pakai magic bytes ZIP (PK), bukan nama file
          if [ "$(head -c 2 paket.zip)" = "PK" ]; then
            echo 'OK: benar-benar file ZIP'
          else
            echo 'GAGAL: bukan ZIP. Isi awal:'
            head -c 400 paket.zip
            exit 1
          fi

      - name: Buka ZIP & ambil APK
        run: |
          mkdir -p kerja work
          unzip -o -j paket.zip -d kerja 2>/dev/null || true
          apk=$(find kerja -iname '*.apk' | head -1)
          echo "APK: $apk"
          [ -n "$apk" ] || { echo 'Tidak ada APK di dalam ZIP'; exit 1; }
          unzip -o -j "$apk" 'assets/*' -d work 2>/dev/null || true
          ls work | head -60

      - name: Filter 5.10 & decode base64 -> .ko
        run: |
          mkdir -p extracted out/ko
          for f in work/5.10*; do [ -f "$f" ] && cp "$f" extracted/; done
          ls extracted
          for f in extracted/*.sh; do
            [ -f "$f" ] || continue
            v=$(sed -n 's/.*MODULE_BASE64="\([^"]*\)".*/\1/p' "$f" | tr -d '[:space:]')
            [ -z "$v" ] && { echo "skip $f"; continue; }
            echo "$v" | base64 -d > "out/ko/$(basename "$f" .sh).ko" && echo "OK: $f"
          done
          ls -la out/ko

      - name: Analisa ELF (.ko)
        run: |
          set +e
          : > out/report.txt
          for ko in out/ko/*.ko; do
            [ -f "$ko" ] || continue
            echo "##### $(basename "$ko") #####" >> out/report.txt
            file "$ko" >> out/report.txt
            ( llvm-readelf -h "$ko" 2>/dev/null || aarch64-linux-gnu-readelf -h "$ko" ) \
              | grep -iE 'Class|Machine|Type' >> out/report.txt
            echo "-- strings: name/vermagic/license --" >> out/report.txt
            strings "$ko" | grep -iE 'name=|vermagic=|license=' >> out/report.txt
            echo "-- 60 baris disassembly pertama --" >> out/report.txt
            ( llvm-objdump -d "$ko" 2>/dev/null || aarch64-linux-gnu-objdump -d "$ko" ) | head -60 >> out/report.txt
            echo "" >> out/report.txt
          done
          wc -l < out/report.txt

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: kernel-5.10-modules
          path: |
            out/ko/
            out/report.txt
          if-no-files-found: warn
