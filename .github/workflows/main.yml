name: Analisis APK (non-kernel)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file unzip binutils llvm

      - name: Download APK dari GitHub Release
        run: |
          curl -sL "https://github.com/vickcoy31-ux/crott/releases/download/miss.v1/DEXO.apk" -o dex.apk
          ls -la dex.apk && file dex.apk

      - name: Daftar semua isi APK
        run: |
          { echo "=== DAFTAR SEMUA ISI APK ==="; unzip -l dex.apk; } > 01-daftar-isi.txt
          echo "Total entri: $(unzip -l dex.apk | tail -1)" >> 01-daftar-isi.txt

      - name: Ekstrak semua isi APK
        run: |
          mkdir -p isi
          unzip -o dex.apk -d isi 2>/dev/null || true
          echo "Total file: $(find isi -type f | wc -l)" > 02-ringkasan.txt
          find isi -type f | sort >> 02-ringkasan.txt

      - name: Klasifikasi semua file (selain kernel)
        run: |
          echo "=== KLASIFIKASI FILE (non-kernel) ===" > 03-klasifikasi.txt
          find isi -type f \
            | grep -viE '\.ko\.sh$|\.ko$' \
            | while read f; do
                echo "$(file -b "$f" | head -c 120) || $f" >> 03-klasifikasi.txt
              done

      - name: Preview isi file teks/script (non-kernel)
        run: |
          echo "=== PREVIEW FILE TEKS/SCRIPT ===" > 04-preview-teks.txt
          find isi -type f \
            | grep -viE '\.ko\.sh$|\.ko$' \
            | while read f; do
                if file "$f" | grep -qiE 'text|script|ascii|utf'; then
                  echo "----- $f -----" >> 04-preview-teks.txt
                  head -c 1500 "$f" >> 04-preview-teks.txt
                  echo "" >> 04-preview-teks.txt
                fi
              done

      - name: Cek binary non-kernel & manifest
        run: |
          echo "=== BINARY NON-KERNEL ===" > 05-binary.txt
          find isi -type f \
            | grep -viE '\.ko\.sh$|\.ko$' \
            | while read f; do
                if file "$f" | grep -qiE 'ELF|PE32|executable|zip|gzip'; then
                  echo "----- $f -----" >> 05-binary.txt
                  file "$f" >> 05-binary.txt
                  strings "$f" | head -30 >> 05-binary.txt
                  echo "" >> 05-binary.txt
                fi
              done
          echo "=== MANIFEST & XML ===" >> 05-binary.txt
          find isi -iname 'AndroidManifest.xml' -o -iname '*.xml' 2>/dev/null | while read f; do
            echo "----- $f -----" >> 05-binary.txt
            strings "$f" | head -50 >> 05-binary.txt
          done

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: analisis-nonkernel
          path: |
            01-daftar-isi.txt
            02-ringkasan.txt
            03-klasifikasi.txt
            04-preview-teks.txt
            05-binary.txt
          if-no-files-found: warn
