name: Analisis Lengkap (semua kernel)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu binutils llvm file unzip

      - name: Download APK dari GitHub Release
        run: |
          curl -sL "https://github.com/vickcoy31-ux/crott/releases/download/miss.v1/DEXO.apk" -o dex.apk
          ls -la dex.apk && file dex.apk

      - name: Ekstrak SEMUA assets
        run: |
          mkdir -p work ko
          unzip -o -j dex.apk 'assets/*' -d work 2>/dev/null || true
          echo "=== MANIFEST aset (N) ===" > manifest.txt
          ls work | sort > manifest.txt.tmp
          wc -l < manifest.txt.tmp >> manifest.txt
          cat manifest.txt.tmp >> manifest.txt
          echo "" >> manifest.txt

      - name: Decode SEMUA .ko dari tiap .sh
        run: |
          for f in work/*.sh; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .sh)
            v=$(tr -d '[:space:]' < "$f" | grep -oE 'f0VMRg[A-Za-z0-9+/=]+' | head -1)
            [ -z "$v" ] && { echo "(no elf) $f"; continue; }
            echo "$v" | base64 -d > "ko/${name}.ko" && echo "decoded -> ko/${name}.ko"
          done
          ls -la ko

      - name: Analisa ELF (.ko)
        run: |
          set +e
          for ko in ko/*.ko; do
            [ -f "$ko" ] || continue
            n=$(basename "$ko")
            echo "############ $n ############" >> report-lengkap.txt
            file "$ko" >> report-lengkap.txt
            echo "--- ELF header ---" >> report-lengkap.txt
            ( llvm-readelf -h "$ko" 2>/dev/null || aarch64-linux-gnu-readelf -h "$ko" ) >> report-lengkap.txt 2>&1
            echo "--- MODULE INFO (strings) ---" >> report-lengkap.txt
            strings "$ko" | grep -iE 'name=|vermagic=|license=|description=|author=' >> report-lengkap.txt
            echo "--- symbol table (awal) ---" >> report-lengkap.txt
            ( llvm-nm "$ko" 2>/dev/null || aarch64-linux-gnu-nm "$ko" ) | head -60 >> report-lengkap.txt
            echo "${KOGR}
          "$" >> report-lengkap.txt
          done
          wc -l < report-lengkap.txt

      - name: Upload hasil lengkap
        uses: actions/upload-artifact@v4
        with:
          name: analisis-lengkap
          path: |
            ko/
            manifest.txt
            report-lengkap.txt
          if-no-files-found: warn
