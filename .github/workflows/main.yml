name: Analisis kernel 5.10 (dari Google Drive)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu binutils llvm file

      - name: Download APK dari Google Drive
        run: |
          FILE_ID="1prwb6TJLnLD2F0R5gARtcqQqN7U5sBy"
          curl -c ./cookie -sL "https://drive.google.com/uc?export=download&id=${FILE_ID}" -o ./page.html
          # cek apakah ada link besar / konfirmasi virus
          if grep -q "confirm=" ./page.html 2>/dev/null; then
            CONFIRM=$(grep -o 'name="confirm" value="[^"]*"' ./page.html | head -1 | sed 's/.*value="//;s/"//')
            curl -b ./cookie -L "https://drive.google.com/uc?export=download&confirm=${CONFIRM}&id=${FILE_ID}" -o dxsr.apk
          else
            mv ./page.html dxsr.apk
          fi
          ls -la dxsr.apk
          file dxsr.apk

      - name: Ekstrak & filter file 5.10
        run: |
          mkdir -p work extracted
          unzip -o -j dxsr.apk 'assets/*' -d work 2>/dev/null || true
          for f in work/5.10*; do [ -f "$f" ] && cp "$f" extracted/; done
          ls extracted

      - name: decode base64 -> .ko
        run: |
          mkdir -p out/ko
          for f in extracted/*.sh; do
            [ -f "$f" ] || continue
            v=$(sed -n 's/.*MODULE_BASE64="\([^"]*\)".*/\1/p' "$f" | tr -d '[:space:]')
            [ -z "$v" ] && { echo "skip $f"; continue; }
            echo "$v" | base64 -d > "out/ko/$(basename "$f" .sh).ko" && echo "OK: $f"
          done
          ls -la out/ko

      - name: Analisa ELF (.ko)
        run: |
          set +e
          : > out/report.txt
          for ko in out/ko/*.ko; do
            [ -f "$ko" ] || continue
            echo "##### $(basename "$ko") #####" >> out/report.txt
            file "$ko" >> out/report.txt
            ( llvm-readelf -h "$ko" 2>/dev/null || aarch64-linux-gnu-readelf -h "$ko" ) \
              | grep -iE 'Class|Machine|Type' >> out/report.txt
            echo "-- strings: name/vermagic/license --" >> out/report.txt
            strings "$ko" | grep -iE 'name=|vermagic=|license=' >> out/report.txt
            echo "-- 60 baris disassembly pertama --" >> out/report.txt
            ( llvm-objdump -d "$ko" 2>/dev/null || aarch64-linux-gnu-objdump -d "$ko" ) | head -60 >> out/report.txt
            echo "" >> out/report.txt
          done
          wc -l < out/report.txt

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: kernel-5.10-modules
          path: |
            out/ko/
            out/report.txt
          if-no-files-found: warn
