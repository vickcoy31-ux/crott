name: Analisis kernel 5.10 (dari Telegram)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu binutils llvm file python3

      - name: Download APK dari bot Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          FILE_ID=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?limit=5" | python3 -c "import sys,json; d=json.load(sys.stdin); f=[m['document']['file_id'] for u in d.get('result',[]) for m in [u.get('message',{})] if 'document' in m]; print(f[-1] if f else '')")
          [ -n "$FILE_ID" ] || { echo 'Tidak ada dokumen di bot -- kirim APK ke @kernelevox_bot dulu'; exit 1; }
          FILE_PATH=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${FILE_ID}" | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['file_path'])")
          curl -sL -o dxsr.apk "https://api.telegram.org/file/bot${BOT_TOKEN}/${FILE_PATH}"
          ls -la dxsr.apk
          file dxsr.apk

      - name: Ekstrak & filter file 5.10
        run: |
          mkdir -p work extracted
          unzip -o -j dxsr.apk 'assets/*' -d work 2>/dev/null || true
          for f in work/5.10*; do [ -f "$f" ] && cp "$f" extracted/; done
          ls extracted

      - name: decode base64 -> .ko
        run: |
          mkdir -p out/ko
          for f in extracted/*.sh; do
            [ -f "$f" ] || continue
            v=$(sed -n 's/.*MODULE_BASE64="\([^"]*\)".*/\1/p' "$f" | tr -d '[:space:]')
            [ -z "$v" ] && { echo "skip $f"; continue; }
            echo "$v" | base64 -d > "out/ko/$(basename "$f" .sh).ko" && echo "OK: $f"
          done
          ls -la out/ko

      - name: Analisa ELF (.ko)
        run: |
          set +e
          : > out/report.txt
          for ko in out/ko/*.ko; do
            [ -f "$ko" ] || continue
            echo "##### $(basename "$ko") #####" >> out/report.txt
            file "$ko" >> out/report.txt
            ( llvm-readelf -h "$ko" 2>/dev/null || aarch64-linux-gnu-readelf -h "$ko" ) \
              | grep -iE 'Class|Machine|Type' >> out/report.txt
            echo "-- strings: name/vermagic/license --" >> out/report.txt
            strings "$ko" | grep -iE 'name=|vermagic=|license=' >> out/report.txt
            echo "-- 60 baris disassembly pertama --" >> out/report.txt
            ( llvm-objdump -d "$ko" 2>/dev/null || aarch64-linux-gnu-objdump -d "$ko" ) | head -60 >> out/report.txt
            echo "" >> out/report.txt
          done
          wc -l < out/report.txt

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: kernel-5.10-modules
          path: |
            out/ko/
            out/report.txt
          if-no-files-found: warn
