name: Analisis kernel 5.10 (dari Release APK)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu binutils llvm file unzip

      - name: Download APK dari GitHub Release
        run: |
          curl -sL "https://github.com/vickcoy31-ux/crott/releases/download/miss.v1/DEXO.apk" -o dex.apk
          ls -la dex.apk && file dex.apk

      - name: Ekstrak assets & filter 5.10
        run: |
          mkdir -p work extracted
          unzip -o -j dex.apk 'assets/*' -d work 2>/dev/null || true
          for f in work/5.10*; do [ -f "$f" ] && cp "$f" extracted/; done
          echo "-- file 5.10 --"; ls extracted

      - name: decode base64 -> .ko (tahan multi-baris)
        run: |
          mkdir -p out/ko
          for f in extracted/*.sh; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .sh)
            # 1) buang SEMUA spasi/newline dulu, baru cari MODULE_BASE64="..."
            v=$(tr -d '[:space:]' < "$f" | sed -n 's/.*MODULE_BASE64="\([^"]*\)".*/\1/p' | head -1)
            # 2) fallback: ambil blok base64 ELF (f0VMRg = magic \x7fELF) apa pun nama variabelnya
            if [ -z "$v" ]; then
              v=$(tr -d '[:space:]' < "$f" | grep -oE 'f0VMRg[A-Za-z0-9+/=]+' | head -1)
            fi
            if [ -z "$v" ]; then
              echo "skip $f (tidak ada base64 ELF)"; continue
            fi
            echo "$v" | base64 -d > "out/ko/${name}.ko" && echo "OK: $f -> ${name}.ko"
          done
          ls -la out/ko

      - name: Analisa ELF (.ko)
        run: |
          set +e
          : > out/report.txt
          for ko in out/ko/*.ko; do
            [ -f "$ko" ] || continue
            echo "##### $(basename "$ko") #####" >> out/report.txt
            file "$ko" >> out/report.txt
            ( llvm-readelf -h "$ko" 2>/dev/null || aarch64-linux-gnu-readelf -h "$ko" ) | grep -iE 'Class|Machine|Type' >> out/report.txt
            strings "$ko" | grep -iE 'name=|vermagic=|license=' >> out/report.txt
            ( llvm-objdump -d "$ko" 2>/dev/null || aarch64-linux-gnu-objdump -d "$ko" ) | head -60 >> out/report.txt
            echo "" >> out/report.txt
          done
          wc -l < out/report.txt

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: kernel-5.10-modules
          path: |
            out/ko/
            out/report.txt
          if-no-files-found: warn
